<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change PIN</title>
  <link href="./output.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-sm mx-auto p-6">

    <div id="currentPinStep">
      <h1 class="text-2xl font-bold text-opay-navy">Change PIN</h1>
      <p class="text-gray-500 mt-1">Enter your current PIN</p>

      <input
        id="currentPinInput"
        type="password"
        inputmode="numeric"
        maxlength="6"
        placeholder="Current PIN"
        class="w-full mt-6 p-3 rounded-xl border border-gray-300 text-center text-2xl tracking-widest focus:outline-none focus:border-opay-green"
      />
      <p id="currentPinError" class="text-red-500 text-sm mt-2 hidden text-center">Incorrect PIN, try again</p>

      <button id="continueBtn" class="w-full mt-6 bg-opay-green text-white py-3 rounded-xl font-semibold">Continue</button>
      <a href="more.html" class="block text-center text-gray-500 mt-4">Cancel</a>
    </div>

    <div id="newPinStep" class="hidden">
      <h1 class="text-2xl font-bold text-opay-navy">Create New PIN</h1>
      <p class="text-gray-500 mt-1">Enter your new 6-digit PIN</p>

      <input
        id="newPinInput"
        type="password"
        inputmode="numeric"
        maxlength="6"
        placeholder="New PIN"
        class="w-full mt-6 p-3 rounded-xl border border-gray-300 text-center text-2xl tracking-widest focus:outline-none focus:border-opay-green"
      />

      <input
        id="confirmPinInput"
        type="password"
        inputmode="numeric"
        maxlength="6"
        placeholder="Confirm New PIN"
        class="w-full mt-4 p-3 rounded-xl border border-gray-300 text-center text-2xl tracking-widest focus:outline-none focus:border-opay-green"
      />
      <p id="newPinError" class="text-red-500 text-sm mt-2 hidden text-center">PINs do not match or are invalid</p>

      <button id="savePinBtn" class="w-full mt-6 bg-opay-green text-white py-3 rounded-xl font-semibold">Save New PIN</button>
    </div>

    <p id="successMsg" class="text-green-600 text-sm text-center mt-3 hidden">PIN changed successfully!</p>

  </div>

  <script src="./change-pin.js"></script>
</body>
</html>
