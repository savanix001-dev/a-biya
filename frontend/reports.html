<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports</title>
  <link href="./output.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 min-h-screen pb-20">
  <div class="max-w-sm mx-auto p-6">
    <h1 class="text-2xl font-bold text-opay-navy">Reports</h1>

    <div class="grid grid-cols-2 gap-3 mt-6">
      <div class="bg-white rounded-xl shadow p-4">
        <p class="text-xs text-gray-500">Total Customers</p>
        <p id="totalCustomers" class="text-xl font-bold text-opay-navy mt-1">0</p>
      </div>
      <div class="bg-white rounded-xl shadow p-4">
        <p class="text-xs text-gray-500">Total Loaned</p>
        <p id="totalLoaned" class="text-xl font-bold text-opay-green mt-1">₦0</p>
      </div>
      <div class="bg-white rounded-xl shadow p-4">
        <p class="text-xs text-gray-500">Total Collected</p>
        <p id="totalCollected" class="text-xl font-bold text-orange-500 mt-1">₦0</p>
      </div>
      <div class="bg-white rounded-xl shadow p-4">
        <p class="text-xs text-gray-500">Total Outstanding</p>
        <p id="totalOutstandingReport" class="text-xl font-bold text-opay-navy mt-1">₦0</p>
      </div>
    </div>

    <h2 class="text-lg font-semibold text-opay-navy mt-6">Overdue Customers</h2>
    <div id="overdueList" class="mt-3 space-y-3"></div>
    <p id="noOverdueMsg" class="text-gray-400 mt-4">No overdue customers.</p>

  </div>

  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3">
    <a href="dashboard.html" class="text-gray-400 text-sm">Home</a>
    <a href="customers.html" class="text-gray-400 text-sm">Customers</a>
    <a href="reports.html" class="text-opay-green font-semibold text-sm">Reports</a>
    <a href="more.html" class="text-gray-400 text-sm">More</a>
  </nav>

  <script src="./reports.js"></script>
</body>
</html>
