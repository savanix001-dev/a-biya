<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Loan</title>
  <link href="./output.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-sm mx-auto p-6">
    <h1 class="text-2xl font-bold text-opay-navy">Add Loan</h1>

    <div class="mt-6">
      <label class="text-sm text-gray-600">Amount (₦)</label>
      <input
        id="amountInput"
        type="number"
        placeholder="e.g. 50000"
        class="w-full mt-1 p-3 rounded-xl border border-gray-300 focus:outline-none focus:border-opay-green"
      />
      <p id="amountError" class="text-red-500 text-sm mt-1 hidden">Amount is required</p>
    </div>

    <div class="mt-4">
      <label class="text-sm text-gray-600">Date Given</label>
      <input
        id="dateGivenInput"
        type="date"
        class="w-full mt-1 p-3 rounded-xl border border-gray-300 focus:outline-none focus:border-opay-green"
      />
    </div>

    <div class="mt-4">
      <label class="text-sm text-gray-600">Due Date (optional)</label>
      <input
        id="dueDateInput"
        type="date"
        class="w-full mt-1 p-3 rounded-xl border border-gray-300 focus:outline-none focus:border-opay-green"
      />
    </div>

    <button
      id="saveBtn"
      class="w-full mt-6 bg-opay-green text-white py-3 rounded-xl font-semibold"
    >Save Loan</button>

    <a id="cancelBtn" href="#" class="block text-center text-gray-500 mt-4">Cancel</a>
  </div>

  <script src="./add-loan.js"></script>
</body>
</html>
