<!DOCTYPE html>
<html lang="en">
<head>

  <title>Enter PIN</title>
  <link href="./output.css" rel="stylesheet" />

<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-sm">
    <h1 id="welcomeBack" class="text-2xl font-bold text-center text-opay-navy">Welcome Back</h1>
    <p class="text-center text-gray-500 mt-2 text-sm">Enter your PIN to continue</p>

    <div class="flex justify-between gap-2 mt-6">
      <input type="password" inputmode="numeric" maxlength="1" class="pin-box w-12 h-14 text-center text-xl border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-opay-green" />
      <input type="password" inputmode="numeric" maxlength="1" class="pin-box w-12 h-14 text-center text-xl border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-opay-green" />
      <input type="password" inputmode="numeric" maxlength="1" class="pin-box w-12 h-14 text-center text-xl border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-opay-green" />
      <input type="password" inputmode="numeric" maxlength="1" class="pin-box w-12 h-14 text-center text-xl border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-opay-green" />
      <input type="password" inputmode="numeric" maxlength="1" class="pin-box w-12 h-14 text-center text-xl border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-opay-green" />
      <input type="password" inputmode="numeric" maxlength="1" class="pin-box w-12 h-14 text-center text-xl border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-opay-green" />
    </div>

    <p id="errorMsg" class="text-red-500 text-sm text-center mt-3 hidden">Incorrect PIN. Try again.</p>

    <button id="loginBtn" class="mt-6 w-full bg-opay-green text-white font-semibold py-3 rounded-xl active:opacity-80">Login</button>
  </div>

  <script src="./login-pin.js"></script>
</body>
</html>
