<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers</title>
  <link href="./output.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 min-h-screen pb-20">
  <div class="max-w-sm mx-auto p-6">
    <h1 class="text-2xl font-bold text-opay-navy">Customers</h1>

    <input
      id="searchInput"
      type="text"
      placeholder="Search by name or phone"
      class="w-full mt-4 p-3 rounded-xl border border-gray-300 focus:outline-none focus:border-opay-green"
    />

    <div id="customerList" class="mt-4 space-y-3"></div>

    <p id="emptyMsg" class="text-center text-gray-400 mt-10 hidden">
      No customers yet. Tap + to add one.
    </p>
  </div>

  <a
    href="add-customer.html"
    id="addBtn"
    class="fixed bottom-24 right-6 bg-opay-green text-white w-14 h-14 rounded-full flex items-center justify-center text-3xl shadow-lg"
  >+</a>

  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3">
    <a href="dashboard.html" class="text-gray-400 text-sm">Home</a>
    <a href="customers.html" class="text-opay-green font-semibold text-sm">Customers</a>
    <a href="reports.html" class="text-gray-400 text-sm">Reports</a>
    <a href="more.html" class="text-gray-400 text-sm">More</a>
  </nav>

  <script src="./customers.js"></script>
</body>
</html>
