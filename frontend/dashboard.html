<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <link href="./output.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 min-h-screen pb-20">
  <div class="max-w-sm mx-auto p-6">
    <h1 id="welcomeMsg" class="text-2xl font-bold text-opay-navy">Welcome</h1>
    <p class="text-gray-500 mt-1">Here's your business overview</p>

    <div class="bg-white rounded-2xl shadow-md p-6 mt-6">
      <p class="text-gray-500 text-sm">Total Outstanding</p>
      <p id="totalOutstanding" class="text-3xl font-bold text-opay-navy mt-1">₦0</p>
    </div>

    <a id="dueTodayCard" href="reports.html" class="hidden block bg-orange-50 border border-orange-400 rounded-xl p-4 mt-4">
      <p id="dueTodayText" class="text-orange-600 font-semibold text-sm"></p>
    </a>

    <a id="overdueCard" href="reports.html" class="hidden block bg-red-50 border border-red-400 rounded-xl p-4 mt-4">
      <p id="overdueText" class="text-red-600 font-semibold text-sm"></p>
    </a>

    <div class="grid grid-cols-3 gap-2 mt-6">
      <a href="add-customer.html" class="bg-opay-green text-white text-center text-sm py-3 rounded-xl font-semibold">+ Customer</a>
      <a href="customers.html?action=addLoan" class="bg-opay-navy text-white text-center text-sm py-3 rounded-xl font-semibold">+ Loan</a>
      <a href="customers.html?action=recordPayment" class="bg-red-500 text-white text-center text-sm py-3 rounded-xl font-semibold">Payment</a>
    </div>
  </div>

  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-3">
    <a href="dashboard.html" class="text-opay-green font-semibold text-sm">Home</a>
    <a href="customers.html" class="text-gray-400 text-sm">Customers</a>
    <a href="reports.html" class="text-gray-400 text-sm">Reports</a>
    <a href="more.html" class="text-gray-400 text-sm">More</a>
  </nav>

  <script src="./dashboard.js"></script>
</body>
</html>
