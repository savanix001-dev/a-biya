<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Record Payment</title>
  <link href="./output.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="max-w-sm mx-auto p-6">

    <div id="formStep">
      <h1 class="text-2xl font-bold text-opay-navy">Record Payment</h1>
      <p id="customerNameLabel" class="text-gray-500 mt-1"></p>
      <p class="text-gray-500 text-sm mt-2">Current Balance: <span id="currentBalance" class="font-semibold text-opay-navy">₦0</span></p>

      <div class="mt-6">
        <label class="text-sm text-gray-600">Amount Paid (₦)</label>
        <input
          id="amountInput"
          type="number"
          placeholder="e.g. 10000"
          class="w-full mt-1 p-3 rounded-xl border border-gray-300 focus:outline-none focus:border-opay-green"
        />
        <p id="amountError" class="text-red-500 text-sm mt-1 hidden">Amount is required</p>
        <p id="overpayWarning" class="text-orange-500 text-sm mt-1 hidden"></p>
      </div>

      <div class="mt-4">
        <label class="text-sm text-gray-600">Date Paid</label>
        <input
          id="datePaidInput"
          type="date"
          class="w-full mt-1 p-3 rounded-xl border border-gray-300 focus:outline-none focus:border-opay-green"
        />
      </div>

      <button
        id="continueBtn"
        class="w-full mt-6 bg-opay-green text-white py-3 rounded-xl font-semibold"
      >Continue</button>

      <a id="cancelBtn" href="#" class="block text-center text-gray-500 mt-4">Cancel</a>
    </div>

    <div id="pinStep" class="hidden">
      <h1 class="text-2xl font-bold text-opay-navy">Enter PIN to Confirm</h1>
      <p class="text-gray-500 mt-1">Enter your PIN to save this payment</p>

      <input
        id="pinInput"
        type="password"
        inputmode="numeric"
        maxlength="6"
        placeholder="Enter PIN"
        class="w-full mt-6 p-3 rounded-xl border border-gray-300 text-center text-2xl tracking-widest focus:outline-none focus:border-opay-green"
      />
      <p id="pinError" class="text-red-500 text-sm mt-2 hidden text-center">Incorrect PIN, try again</p>

      <button
        id="confirmBtn"
        class="w-full mt-6 bg-opay-green text-white py-3 rounded-xl font-semibold"
      >Confirm Payment</button>

      <button id="backBtn" class="block w-full text-center text-gray-500 mt-4">Back</button>
    </div>

  </div>

  <script src="./record-payment.js"></script>
</body>
</html>
