<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name</title>
  <link href="./output.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-sm">
    <h1 class="text-2xl font-bold text-center text-opay-navy">Almost Done</h1>
    <p class="text-center text-gray-500 mt-2 text-sm">This appears on your statements and receipts</p>

    <label class="block text-sm text-gray-600 mt-6 mb-1">Name (business or personal)</label>
    <input
      id="nameInput"
      type="text"
      placeholder="e.g. Musa Trading or Musa Ibrahim"
      class="w-full border border-gray-300 rounded-xl px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-opay-green"
    />

    <button id="continueBtn" class="mt-6 w-full bg-opay-green text-white font-semibold py-3 rounded-xl active:opacity-80">Continue</button>

    <button id="skipBtn" class="mt-3 w-full text-gray-400 text-sm py-2">Skip for now</button>
  </div>

  <script src="./profile.js"></script>
</body>
</html>
